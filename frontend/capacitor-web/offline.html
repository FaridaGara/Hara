<!doctype html>
<html lang="az">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f5f7" />
    <title>HARA — bağlantı yoxdur</title>
    <style>
      :root { color-scheme: light; font-family: Inter, Arial, sans-serif; }
      * { box-sizing: border-box; }
      body {
        align-items: center;
        background: #f3f5f7;
        color: #18181a;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100dvh;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      }
      main { max-width: 320px; text-align: center; }
      h1 { font-size: 28px; margin: 0 0 12px; }
      p { color: rgb(24 24 26 / 65%); line-height: 1.5; margin: 0 0 20px; }
      button {
        background: #98ff00;
        border: 0;
        border-radius: 16px;
        color: #18181a;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        min-height: 48px;
        padding: 0 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>İnternet bağlantısı yoxdur</h1>
      <p>HARA-nı açmaq üçün bağlantını yoxlayıb yenidən cəhd edin.</p>
      <button type="button" onclick="window.location.reload()">Yenidən cəhd et</button>
    </main>
  </body>
</html>
